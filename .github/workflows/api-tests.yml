name: TechShop API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api-tests:
    name: api-tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js 20
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install TechShop API dependencies
      - name: Install TechShop API dependencies
        run: npm install
        working-directory: techshop-api/broken-app

      # 4. Start the TechShop API in the background
      - name: Start the TechShop API
        run: node techshop-api/broken-app/server.js &

      # 5. Wait for the server to be ready
      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/health; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... attempt $i"
            sleep 2
          done
          echo "Server did not start in time"
          exit 1

      # 6. Install Newman and the HTML reporter
      - name: Install Newman and HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      # 7. Run Postman collection with Newman
      - name: Run Postman collection with Newman
        id: newman
        continue-on-error: true
        run: |
          newman run techshop.postman_collection.json \
            --env-var base_url=http://localhost:3000 \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-report.html
          # Ensure report file exists even on failure
          ls -la newman-report.html 2>/dev/null || echo "Newman report not generated"

      # 8. Install Bruno CLI
      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      # 9. Run Bruno collection
      - name: Run Bruno collection
        id: bruno
        continue-on-error: true
        run: |
          cd techshop-bruno
          bru run --env local

      # 10. Set up Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 11. Install Python dependencies
      - name: Install Python dependencies
        run: pip install pytest requests pytest-html robotframework robotframework-requests

      # 12. Run pytest
      - name: Run pytest
        id: pytest
        continue-on-error: true
        env:
          BASE_URL: http://localhost:3000
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          pytest test_techshop.py -v \
            --html=pytest-report.html \
            --self-contained-html \
            -p no:cacheprovider
          ls -la pytest-report.html 2>/dev/null || echo "pytest report not generated"

      # 13. Run Robot Framework
      - name: Run Robot Framework
        id: robot
        continue-on-error: true
        env:
          BASE_URL: http://localhost:3000
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          mkdir -p robot-results
          robot \
            --variable BASE_URL:http://localhost:3000 \
            --outputdir robot-results \
            techshop.robot
          ls -la robot-results/ || echo "No robot results generated"

      # 14. Upload pytest HTML report as artifact
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.html
          if-no-files-found: warn

      # 15. Upload Robot Framework report as artifact
      - name: Upload Robot Framework report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: robot-results/
          if-no-files-found: warn

      # 16. Upload Newman report as artifact
      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.html
          if-no-files-found: warn

      - name: Pipeline summary
        if: always()
        run: |
          echo "## Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Newman | ${{ steps.newman.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bruno | ${{ steps.bruno.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pytest | ${{ steps.pytest.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Robot Framework | ${{ steps.robot.outcome }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail job if any suite failed
        if: always()
        run: |
          if [ "${{ steps.newman.outcome }}" = "failure" ] ||
             [ "${{ steps.bruno.outcome }}" = "failure" ] ||
             [ "${{ steps.pytest.outcome }}" = "failure" ] ||
             [ "${{ steps.robot.outcome }}" = "failure" ]; then
            echo "One or more test suites failed"
            exit 1
          fi

